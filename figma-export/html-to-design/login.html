<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobCal - Login</title>
  <style>
    body{margin:0;font-family:"Pretendard","Noto Sans KR",sans-serif;background:#f1f6fd;display:grid;place-items:center;min-height:100vh;color:#132033}
    .card{width:min(520px,calc(100vw - 32px));border:1px solid #cfd8e3;border-radius:24px;background:linear-gradient(160deg, rgba(255,255,255,.95), rgba(244,249,255,.92));padding:32px;box-shadow:0 14px 36px rgba(54,60,74,.08)}
    h1{margin:0 0 8px;font-size:34px;font-weight:900;letter-spacing:-0.02em}
    p{margin:0;color:#475569;line-height:1.6}
    button{margin-top:24px;width:100%;height:48px;border-radius:16px;border:1px solid #d1d5db;background:#fff;font-size:15px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>로그인이 필요합니다</h1>
    <p>JobCal을 사용하려면 로그인해 주세요. 구글 계정으로 빠르게 로그인할 수 있습니다.</p>
    <button>Google로 계속하기</button>
  </main>
</body>
</html>
