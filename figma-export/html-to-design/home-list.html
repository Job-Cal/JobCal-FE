<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobCal - Home (List)</title>
  <style>
    :root { --bg:#f1f6fd; --surface:#fff; --line:#cfd8e3; --brand:#136fbd; --text:#132033; --muted:#58677c; }
    *{box-sizing:border-box} body{margin:0;font-family:"Pretendard","Noto Sans KR",sans-serif;color:var(--text);background:var(--bg)}
    .container{max-width:1180px;margin:0 auto;padding:0 16px 32px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .brand{display:flex;align-items:center;gap:10px}.logo{width:112px;height:112px;border-radius:16px;background:#d7e8f8;display:grid;place-items:center;font-weight:900}
    .title{font-size:42px;font-weight:900;line-height:1}.tagline{margin-top:8px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg, rgba(255,255,255,.95), rgba(244,249,255,.92));box-shadow:0 14px 36px rgba(54,60,74,.08);padding:18px 24px 24px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.seg{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:16px;background:#fff;gap:4px}
    .seg button{border:0;border-radius:10px;padding:10px 16px;background:transparent;font-weight:700;color:#334155}.seg button.active{background:var(--brand);color:#fff}
    .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .filters input,.filters select{height:42px;border-radius:14px;border:1px solid var(--line);padding:0 14px;background:#fff;color:#334155}
    table{width:100%;border-collapse:collapse;background:#fff}.table-wrap{overflow:hidden;border-radius:14px;border:1px solid #dbe6f2}
    thead th{background:#edf4fb;padding:12px 16px;text-align:left;font-size:12px;color:var(--muted);font-weight:800}
    tbody td{padding:14px 16px;border-top:1px solid #e6eef8;font-size:14px}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .b1{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
    .b2{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
    .b3{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <div class="brand"><div class="logo">JobCal</div><div><div class="title">JobCal</div><div class="tagline">Never Miss a Deadline</div></div></div>
      <div><button style="width:44px;height:44px;border-radius:16px;border:1px solid #cfd8e3;background:#fff"></button></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <div class="seg"><button>캘린더</button><button class="active">리스트</button></div>
        <div><button style="width:40px;height:40px;border-radius:14px;border:0;background:#136fbd;color:#fff">+</button></div>
      </div>

      <div class="filters">
        <input placeholder="회사명/직무 검색" />
        <select><option>전체 상태</option></select>
        <select><option>마감일 빠른순</option></select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>회사명</th><th>직무</th><th>마감일</th><th>상태</th></tr>
          </thead>
          <tbody>
            <tr><td><b>카카오</b></td><td>프론트엔드 엔지니어</td><td>2026-03-05</td><td><span class="badge b1">지원 예정</span></td></tr>
            <tr><td><b>네이버</b></td><td>백엔드 엔지니어</td><td>2026-03-10</td><td><span class="badge b2">서류 제출</span></td></tr>
            <tr><td><b>토스</b></td><td>Product Designer</td><td>2026-03-15</td><td><span class="badge b3">면접 진행</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
